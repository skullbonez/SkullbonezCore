broadphase_cell  = 24.0

# Persistent object-contact solver tuning. These values preserve the current
# Catto-style behavior by default, but keeping them in config makes future solver
# experiments explicit instead of burying policy in the hot loop.
#
# persistent_contact_slop:
#   Allowed object/object overlap before bias or positional correction reacts.
#   A small slop prevents quiet stacks from jittering while chasing float noise.
#
# persistent_contact_baumgarte_beta:
#   Fraction of penetration error converted into velocity-level bias each tick.
#   Higher values remove overlap faster but can inject visible bounce into stacks.
#
# persistent_contact_position_correction_percent:
#   Final direct position nudge after PGS. This is engine cleanup policy on top of
#   Catto's velocity-level bias; keep it partial so stacks do not pop.
#
# persistent_contact_solver_iterations:
#   Maximum PGS row sweeps. The solver may early-out when accumulated impulse
#   changes become tiny, but this cap bounds worst-case contact cost.
persistent_contact_slop = 0.005
persistent_contact_baumgarte_beta = 0.2
persistent_contact_position_correction_percent = 0.35
persistent_contact_solver_iterations = 12

# Terrain contact solver tuning. The terrain path is still being migrated toward
# the shared Catto row math. These settings keep terrain support and penetration
# cleanup policy visible while that migration happens.
terrain_contact_threshold = 0.15
terrain_contact_slop = 0.005
terrain_contact_baumgarte_beta = 0.3
terrain_max_baumgarte_bias = 2.0

# Sleep tuning. Sleep is intentionally stricter than "has any contact": a body
# must be quiet for this many frames and be part of a credible supported island.
physics_sleep_linear_speed = 0.5
physics_sleep_angular_speed = 0.3
physics_sleep_frames = 30

