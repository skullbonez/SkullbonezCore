name: Mandatory CPU validation

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    name: Mandatory CPU lane (Windows hosted)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Record hosted-runner context
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "TestOutput\validation\ci"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          @(
            "runner_name=$env:RUNNER_NAME"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
          ) | Set-Content -Path (Join-Path $artifactDir "hosted-runner.txt")

      - name: Install pinned clang-format 21
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $llvmVersion = "21.1.8"

          # Hazard: this pin used to come from the Chocolatey community feed,
          # which proved unreliable on 2026-08-15. `choco upgrade llvm
          # --version=21.1.8` reported "llvm was not found with the source(s)
          # listed", upgraded 0/1 packages, and still exited 0, leaving the
          # runner's pre-installed clang-format 20.1.8 in place; the same feed
          # was returning 504 Gateway Timeout for another package minutes later,
          # so whether the version was withdrawn or the feed was simply degraded
          # was never established. Either way a silent wrong-version resolution
          # is unacceptable for a formatting gate, and only the version assertion
          # below caught it. The PyPI wheel ships the same official LLVM binary,
          # is version-addressed, and installs in seconds rather than timing out.
          # Downgrading the pin is not an option: .clang-format uses
          # BinPackLongBracedList, which clang-format 20 rejects outright.
          python -m pip install --disable-pip-version-check --quiet "clang-format==$llvmVersion"
          if ($LASTEXITCODE -ne 0) {
            throw "pip failed to install clang-format $llvmVersion (exit $LASTEXITCODE)"
          }

          $formatter = & python -c "import clang_format, os; print(os.path.join(os.path.dirname(clang_format.__file__), 'data', 'bin', 'clang-format.exe'))"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $formatter)) {
            throw "Pinned clang-format executable was not installed: $formatter"
          }
          $versionText = (& $formatter --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $versionText -notmatch "\bversion 21\.1\.8\b") {
            throw "Installed formatter does not report clang-format 21.1.8: $versionText"
          }

          & $formatter --style=file --dump-config | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned clang-format cannot parse the repository .clang-format"
          }

          "CLANG_FMT=$formatter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @(
            "clang_format_path=$formatter"
            "clang_format_version=$versionText"
          ) | Add-Content -Path (
            Join-Path $env:GITHUB_WORKSPACE "TestOutput\validation\ci\hosted-runner.txt"
          )

      - name: Install pinned OpenCppCoverage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Hazard: the Chocolatey community feed returned 504 Gateway Timeout for
          # this package on 2026-08-15, failing the lane after 108 seconds of
          # internal retries. That is a transient service fault rather than a
          # withdrawn package, so a bounded retry is the proportionate fix; a
          # single attempt makes the mandatory gate hostage to one feed's uptime.
          # No unpinned fallback is permitted here — a coverage gate that silently
          # ran a different OpenCppCoverage build would be worse than a red lane.
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            choco install opencppcoverage --version=0.9.9.0 --yes --no-progress
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq $attempts) {
              throw "Chocolatey failed to install OpenCppCoverage 0.9.9.0 after $attempts attempts (exit $LASTEXITCODE)"
            }
            $delaySeconds = 15 * $attempt
            Write-Host "OpenCppCoverage install attempt $attempt failed; retrying in $delaySeconds s"
            Start-Sleep -Seconds $delaySeconds
          }
          $coverageExe = "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"
          if (-not (Test-Path -LiteralPath $coverageExe)) {
            throw "Pinned OpenCppCoverage executable was not installed: $coverageExe"
          }
          $coverageHelp = & $coverageExe --help 2>&1
          # OpenCppCoverage 0.9.9.0 prints valid help/version text but returns
          # -1618178468 from its help-only path. The real coverage invocation
          # still owns runtime health; this bootstrap probe verifies identity.
          if (-not ($coverageHelp | Select-String -Quiet -Pattern "OpenCppCoverage Version: 0\.9\.9\.0")) {
            throw "Installed OpenCppCoverage does not report pinned version 0.9.9.0"
          }
          exit 0

      - name: Run mandatory hosted CPU lane
        env:
          SKORE_SIZE_DIFF_BASE: ${{ github.event.pull_request.base.sha || '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "TestOutput\validation\ci"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $log = Join-Path $artifactDir "mandatory-cpu-lane.log"
          $gates = @(
            [pscustomobject]@{
              Name = "validate_fast.bat --preflight-only"
              Command = "tools\validate_fast.bat --preflight-only"
            }
            [pscustomobject]@{
              Name = "validate_all_cpu_tests.bat"
              Command = "tools\validate_all_cpu_tests.bat"
            }
          )

          foreach ($gate in $gates) {
            "=== $($gate.Name) ===" |
              Tee-Object -FilePath $log -Append
            & cmd.exe /d /c $gate.Command 2>&1 |
              Tee-Object -FilePath $log -Append
            $exitCode = $LASTEXITCODE
            "child=$($gate.Name) exit_code=$exitCode" |
              Tee-Object -FilePath $log -Append
            if ($exitCode -ne 0) {
              "mandatory_cpu_lane_failed=$($gate.Name)" |
                Tee-Object -FilePath $log -Append
              exit $exitCode
            }
            if ($gate.Name -eq "validate_fast.bat --preflight-only") {
              $env:SKULLBONEZ_DEPENDENCY_GRAPH_ALREADY_VALIDATED = "1"
            }
          }

          "mandatory_cpu_lane=PASS" |
            Tee-Object -FilePath $log -Append

      - name: Upload CPU failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mandatory-cpu-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestOutput/validation/**
            Profile/*.log
            Profile/*.txt
            Agentic/Tests/**/x64/**/*.log
          if-no-files-found: warn
          retention-days: 14
