name: Mandatory CPU validation

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-preflight:
    name: CPU preflight
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install pinned build prerequisites
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
        with:
          nuget-version: 6.14.3

      - name: Restore PIX and install clang-format
        shell: pwsh
        run: |
          nuget restore packages.config -PackagesDirectory packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed (exit $LASTEXITCODE)" }
          python -m pip install --disable-pip-version-check --quiet "clang-format==21.1.8"
          if ($LASTEXITCODE -ne 0) { throw "clang-format install failed (exit $LASTEXITCODE)" }
          $formatter = & python -c "import clang_format, os; print(os.path.join(os.path.dirname(clang_format.__file__), 'data', 'bin', 'clang-format.exe'))"
          $version = (& $formatter --version 2>&1 | Out-String).Trim()
          if ($version -notmatch "\bversion 21\.1\.8\b") { throw "Unexpected clang-format: $version" }
          "SKULLBONEZ_CLANG_FORMAT=$formatter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run parallel mandatory preflight
        env:
          SKORE_SIZE_DIFF_BASE: ${{ github.event.pull_request.base.sha || '' }}
        shell: pwsh
        run: |
          tools\validate_fast.bat --preflight-only
          if ($LASTEXITCODE -ne 0) { throw "CPU preflight failed (exit $LASTEXITCODE)" }

      - name: Upload preflight failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-preflight-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestOutput/validation/**
          if-no-files-found: warn
          retention-days: 14

  cpu-test-lanes:
    name: CPU ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - lane: tests
            name: Profile doctest suite
            os: windows-latest
            command: tools\validate_tests.bat
          - lane: coverage
            name: Debug coverage
            os: windows-2022
            command: tools\validate_coverage.bat
          - lane: runtime-interaction
            name: runtime interaction
            os: windows-latest
            command: tools\validate_runtime_interaction_policy.bat
          - lane: scene-parser
            name: scene parser
            os: windows-latest
            command: tools\validate_scene_parser_tests.bat
          - lane: ui-boundary
            name: UI boundary
            os: windows-latest
            command: tools\validate_ui_boundary_tests.bat
          - lane: dx12-architecture
            name: DX12 architecture
            os: windows-latest
            command: tools\validate_dx12_arch_tests.bat
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install pinned build prerequisites
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
        with:
          nuget-version: 6.14.3

      - name: Restore PIX and install clang-format
        shell: pwsh
        run: |
          nuget restore packages.config -PackagesDirectory packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed (exit $LASTEXITCODE)" }
          python -m pip install --disable-pip-version-check --quiet "clang-format==21.1.8"
          if ($LASTEXITCODE -ne 0) { throw "clang-format install failed (exit $LASTEXITCODE)" }
          $formatter = & python -c "import clang_format, os; print(os.path.join(os.path.dirname(clang_format.__file__), 'data', 'bin', 'clang-format.exe'))"
          "SKULLBONEZ_CLANG_FORMAT=$formatter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned OpenCppCoverage
        if: matrix.lane == 'coverage'
        shell: pwsh
        run: |
          $coverageVersion = "0.9.9.0"
          $url = "https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-$coverageVersion/OpenCppCoverageSetup-x64-$coverageVersion.exe"
          $expected = "2295A733DA39412C61E4F478677519DD0BB1893D88313CE56B468C9E50517888"
          $installer = Join-Path $env:RUNNER_TEMP "OpenCppCoverageSetup-x64-$coverageVersion.exe"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
              break
            }
            catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash
          if ($actual -ne $expected) { throw "Coverage installer digest mismatch. expected=$expected actual=$actual" }
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Coverage install failed (exit $($process.ExitCode))" }

      - name: Run isolated CPU lane
        env:
          CPU_LANE_COMMAND: ${{ matrix.command }}
        shell: pwsh
        run: |
          & cmd.exe /d /c $env:CPU_LANE_COMMAND
          if ($LASTEXITCODE -ne 0) { throw "${{ matrix.name }} failed (exit $LASTEXITCODE)" }

      - name: Upload CPU lane failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-${{ matrix.lane }}-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestOutput/**
            Profile/*.log
            Profile/*.txt
            Agentic/Tests/**/x64/**/*.log
          if-no-files-found: warn
          retention-days: 14

  mandatory-cpu:
    name: Mandatory CPU lane (Windows hosted)
    needs: [cpu-preflight, cpu-test-lanes]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all isolated CPU runners passed
        run: echo "All mandatory CPU runners passed."

  physics-artifact:
    name: Build early shared Debug physics artifact
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install pinned build prerequisites
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
        with:
          nuget-version: 6.14.3

      - name: Restore, verify golden, and build once
        shell: pwsh
        run: |
          python tools\check_physics_baseline_guard.py --repo .
          if ($LASTEXITCODE -ne 0) { throw "Physics golden check failed (exit $LASTEXITCODE)" }
          nuget restore packages.config -PackagesDirectory packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed (exit $LASTEXITCODE)" }
          python -m pip install --disable-pip-version-check --quiet "clang-format==21.1.8"
          $formatter = & python -c "import clang_format, os; print(os.path.join(os.path.dirname(clang_format.__file__), 'data', 'bin', 'clang-format.exe'))"
          $env:SKULLBONEZ_CLANG_FORMAT = $formatter
          tools\validate_build.bat Debug
          if ($LASTEXITCODE -ne 0) { throw "Debug build failed (exit $LASTEXITCODE)" }

          $payload = "TestOutput\validation\ci\shared-physics-runtime"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          $files = [ordered]@{
            "SKULLBONEZ_CORE.exe" = "Debug\SKULLBONEZ_CORE.exe"
            "dxcompiler.dll" = "Debug\dxcompiler.dll"
            "dxil.dll" = "Debug\dxil.dll"
            "WinPixEventRuntime.dll" = "packages\WinPixEventRuntime.1.0.240308001\bin\x64\WinPixEventRuntime.dll"
          }
          foreach ($entry in $files.GetEnumerator()) {
            Copy-Item -LiteralPath $entry.Value -Destination (Join-Path $payload $entry.Key)
          }
          $manifest = [ordered]@{
            schema = 1
            source_sha = $env:GITHUB_SHA
            evidence_form = "one Debug build, isolated smoke and scene processes on four fresh hosted runners"
            files = @($files.Keys | ForEach-Object {
              $path = Join-Path $payload $_
              [ordered]@{ name = $_; sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash; bytes = (Get-Item $path).Length }
            })
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM -Path (Join-Path $payload "manifest.json")

      - name: Upload shared Debug physics artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-physics-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestOutput/validation/ci/shared-physics-runtime
          if-no-files-found: error
          retention-days: 14

  physics-byte-evidence:
    name: Physics ${{ matrix.case }} (replica ${{ matrix.replica }})
    needs: physics-artifact
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        replica: [1, 2]
        case: [lifecycle-smoke, varied-scene]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Download exact shared artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hosted-physics-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: Debug

      - name: Verify artifact and run isolated process
        env:
          PHYSICS_CASE: ${{ matrix.case }}
          PHYSICS_REPLICA: ${{ matrix.replica }}
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw Debug\manifest.json | ConvertFrom-Json
          if ($manifest.schema -ne 1 -or $manifest.source_sha -ne $env:GITHUB_SHA) { throw "Artifact provenance mismatch" }
          foreach ($file in $manifest.files) {
            $path = Join-Path "Debug" $file.name
            if ((Get-FileHash -Algorithm SHA256 $path).Hash -ne $file.sha256 -or (Get-Item $path).Length -ne $file.bytes) {
              throw "Artifact bytes differ for $($file.name)"
            }
          }

          $evidence = "TestOutput\validation\ci\physics-$env:PHYSICS_CASE-$env:PHYSICS_REPLICA"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $env:SKULLBONEZ_PSO_CACHE_DIR = Join-Path $evidence "pso-cache"
          New-Item -ItemType Directory -Force -Path $env:SKULLBONEZ_PSO_CACHE_DIR | Out-Null
          if ($env:PHYSICS_CASE -eq "lifecycle-smoke") {
            & .\Debug\SKULLBONEZ_CORE.exe --physics-standalone-smoke *> (Join-Path $evidence "process.log")
            if ($LASTEXITCODE -ne 0) { throw "Lifecycle smoke failed (exit $LASTEXITCODE)" }
          }
          else {
            $regression = (Resolve-Path Debug).Path + "\physics_regression_varied.csv"
            $perf = (Resolve-Path $evidence).Path + "\perf.csv"
            & .\Debug\SKULLBONEZ_CORE.exe --renderer dx12 --vsync off --fixed-step --shadows off --scene SkullbonezData/scenes/physics_bench_varied.scene.json --perf-log $perf --physics-regression-log $regression *> (Join-Path $evidence "process.log")
            if ($LASTEXITCODE -ne 0) { throw "Varied scene failed (exit $LASTEXITCODE)" }
            $env:SKORE_REPO = $env:GITHUB_WORKSPACE
            python tools\check_physics_regression.py
            if ($LASTEXITCODE -ne 0) { throw "Physics comparison failed (exit $LASTEXITCODE)" }
          }

      - name: Upload process evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: physics-${{ matrix.case }}-${{ matrix.replica }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestOutput/validation/ci/physics-${{ matrix.case }}-${{ matrix.replica }}/**
            Debug/physics_regression_varied.csv
          if-no-files-found: warn
          retention-days: 14
