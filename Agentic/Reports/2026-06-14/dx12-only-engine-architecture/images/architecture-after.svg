<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">After DX12 architecture diagram</title>
  <desc id="desc">After this implementation slice, the DX12 backend delegates named policies to helper objects and has a render graph contract for future pass and barrier ownership.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#4b79a8"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#4f9568"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7353b6"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#c99733"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
    <style>
      .page { fill: #f8fafc; }
      .title { font: 700 42px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 23px Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 23px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 20px Arial, sans-serif; fill: #0f172a; }
      .key { font: 400 18px Arial, sans-serif; fill: #475569; }
      .arrow-blue { stroke: #4b79a8; stroke-width: 5; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #4f9568; stroke-width: 5; fill: none; marker-end: url(#arrow-green); }
      .arrow-purple { stroke: #7353b6; stroke-width: 5; fill: none; marker-end: url(#arrow-purple); }
      .arrow-gold { stroke: #c99733; stroke-width: 5; fill: none; marker-end: url(#arrow-gold); }
      .arrow-gray-dashed { stroke: #64748b; stroke-width: 4; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1600" height="1000"/>
  <text class="title" x="70" y="78">After: Named DX12 Helpers Plus Render Graph Contract</text>
  <text class="subtitle" x="72" y="118">Architecture report: state after this implementation slice</text>

  <path class="arrow-blue" d="M 350 260 L 448 260"/>
  <path class="arrow-green" d="M 760 260 L 875 205"/>
  <path class="arrow-green" d="M 760 260 L 875 365"/>
  <path class="arrow-green" d="M 760 260 L 875 525"/>
  <path class="arrow-purple" d="M 760 260 L 875 705"/>
  <path class="arrow-gold" d="M 615 320 L 360 480"/>
  <path class="arrow-blue" d="M 1185 365 L 1250 250"/>
  <path class="arrow-blue" d="M 1405 325 L 1405 410"/>
  <path class="arrow-blue" d="M 1405 545 L 1405 630"/>
  <path class="arrow-gray-dashed" d="M 1370 765 L 625 830"/>

  <rect x="70" y="200" width="280" height="120" rx="8" fill="#e8f1ff" stroke="#6b94d6" stroke-width="3"/>
  <text class="box-title" x="95" y="238">SkullbonezRun</text>
  <text class="box-text" x="95" y="274">Still drives the live frame</text>
  <text class="box-text" x="95" y="302">and scene-level flow.</text>

  <rect x="450" y="200" width="310" height="120" rx="8" fill="#eaf7ef" stroke="#4f9568" stroke-width="3"/>
  <text class="box-title" x="475" y="238">RenderBackendDX12</text>
  <text class="box-text" x="475" y="274">Still records live commands,</text>
  <text class="box-text" x="475" y="302">but delegates named policies.</text>

  <rect x="875" y="160" width="300" height="115" rx="8" fill="#eaf7ef" stroke="#4f9568" stroke-width="3"/>
  <text class="box-title" x="900" y="198">Dx12FenceTimeline</text>
  <text class="box-text" x="900" y="234">Single policy for GPU completion</text>
  <text class="box-text" x="900" y="262">points and CPU wait behavior.</text>

  <rect x="875" y="330" width="300" height="145" rx="8" fill="#eaf7ef" stroke="#4f9568" stroke-width="3"/>
  <text class="box-title" x="900" y="368">Dx12DescriptorAllocator</text>
  <text class="box-text" x="900" y="404">Owns descriptor-table rows:</text>
  <text class="box-text" x="900" y="432">static slots and per-frame</text>
  <text class="box-text" x="900" y="460">temporary slots.</text>

  <rect x="875" y="500" width="300" height="135" rx="8" fill="#eaf7ef" stroke="#4f9568" stroke-width="3"/>
  <text class="box-title" x="900" y="538">Dx12UploadArena</text>
  <text class="box-text" x="900" y="574">Owns CPU-written upload bytes.</text>
  <text class="box-text" x="900" y="602">Resets only after GPU reads finish.</text>

  <rect x="875" y="680" width="300" height="135" rx="8" fill="#f2ecff" stroke="#8b6bd6" stroke-width="3"/>
  <text class="box-title" x="900" y="718">DRED / names / counters</text>
  <text class="box-text" x="900" y="754">GPU failures and validation logs</text>
  <text class="box-text" x="900" y="782">now point to readable names.</text>

  <rect x="1250" y="190" width="300" height="135" rx="8" fill="#eaf2ff" stroke="#5d84bd" stroke-width="3"/>
  <text class="box-title" x="1275" y="228">RenderGraph contract</text>
  <text class="box-text" x="1275" y="264">API-neutral resources, passes,</text>
  <text class="box-text" x="1275" y="292">queues, reads, writes, and access.</text>

  <rect x="1250" y="410" width="300" height="135" rx="8" fill="#eaf2ff" stroke="#5d84bd" stroke-width="3"/>
  <text class="box-title" x="1275" y="448">Transition compiler</text>
  <text class="box-text" x="1275" y="484">Computes before/after access</text>
  <text class="box-text" x="1275" y="512">records future barriers can use.</text>

  <rect x="1250" y="630" width="300" height="145" rx="8" fill="#eaf2ff" stroke="#5d84bd" stroke-width="3"/>
  <text class="box-title" x="1275" y="668">Frame graph skeleton</text>
  <text class="box-text" x="1275" y="704">Documents shadow, reflection,</text>
  <text class="box-text" x="1275" y="732">scene, volumetric, UI, and present.</text>

  <rect x="100" y="475" width="430" height="175" rx="8" fill="#fff7e8" stroke="#c99733" stroke-width="3"/>
  <text class="box-title" x="125" y="515">Validation behavior</text>
  <text class="box-text" x="125" y="553">validate_renderers.bat now fails fast</text>
  <text class="box-text" x="125" y="581">on build failure before renderer launches.</text>
  <text class="box-text" x="125" y="609">GL/DX11/DX12 parity still protects output.</text>

  <rect x="100" y="775" width="520" height="135" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text class="box-title" x="125" y="815">Current boundary</text>
  <text class="box-text" x="125" y="853">This is scaffolding and diagnostics, not a full renderer rewrite.</text>
  <text class="box-text" x="125" y="881">Live barriers still run through the current backend.</text>

  <text class="key" x="790" y="870">Dashed arrow = future migration path from graph diagnostics to live barrier ownership.</text>
  <text class="key" x="80" y="960">Color key: green = extracted DX12 ownership, blue = render graph contract, purple = diagnostics, yellow = validation, gray = remaining boundary.</text>
</svg>
