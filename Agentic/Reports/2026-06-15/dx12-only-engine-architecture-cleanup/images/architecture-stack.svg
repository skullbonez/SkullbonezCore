<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">DX12 architecture cleanup stack</title>
  <desc id="desc">Three stacked pull requests: shader contracts, DX12 binding ABI, and architecture documentation cleanup.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 6; }
      .one { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 6; }
      .two { fill: #dcfce7; stroke: #15803d; stroke-width: 2; rx: 6; }
      .three { fill: #fef3c7; stroke: #b45309; stroke-width: 2; rx: 6; }
      .title { font-family: Segoe UI, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .label { font-family: Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .small { font-family: Segoe UI, Arial, sans-serif; font-size: 16px; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569" />
    </marker>
  </defs>
  <rect class="bg" width="1280" height="480" />
  <text class="title" x="48" y="56">Requested DX12 Architecture Stack</text>

  <rect class="one" x="70" y="125" width="320" height="150" />
  <text class="label" x="102" y="165">PR #69</text>
  <text class="small" x="102" y="200">Shader contracts</text>
  <text class="small" x="102" y="228">CPU RenderMaterial bridge</text>
  <text class="small" x="102" y="256">DX12 renderer gate passed</text>

  <rect class="two" x="480" y="125" width="320" height="150" />
  <text class="label" x="512" y="165">PR #70</text>
  <text class="small" x="512" y="200">DX12 binding ABI</text>
  <text class="small" x="512" y="228">b0, t0..t3, s0/s1/s3</text>
  <text class="small" x="512" y="256">DX12 renderer gate passed</text>

  <rect class="three" x="890" y="125" width="320" height="150" />
  <text class="label" x="922" y="165">PR #71</text>
  <text class="small" x="922" y="200">Architecture docs cleanup</text>
  <text class="small" x="922" y="228">GL/DX11 context archived</text>
  <text class="small" x="922" y="256">Docs-only, no gate needed</text>

  <path class="arrow" d="M 390 200 L 468 200" />
  <path class="arrow" d="M 800 200 L 878 200" />

  <rect class="box" x="310" y="335" width="660" height="72" />
  <text class="small" x="344" y="372">Next recommended concrete slice: water cleanup, or material payload/root-signature expansion only if explicitly scoped.</text>
</svg>
