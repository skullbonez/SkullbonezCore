schema_version: 1
schema: queue
required_fields:
  - schema_version
  - policy
  - machine
  - loop
  - state_vocabulary
  - items

item_required_fields:
  - id
  - plan
  - state
  - priority
  - branch
  - impact_area
  - validation_gate
  - depends_on
  - report_required

item_field_types:
  id: string
  plan: string
  state: string
  priority: integer
  branch: string
  impact_area: list
  validation_gate: string
  validation_notes: string
  depends_on: list
  dependency_mode: string
  report_required: boolean

invariants:
  - "Every item.state must exist in machines/roadmap-item.yaml."
  - "At most one item may be in an active state."
  - "Every item.plan path must exist unless the item is explicitly external."
  - "Successful terminal items pointing at Agentic/Plans must declare archive_deferred with a reason."
  - "Dependencies must refer to existing item ids."
