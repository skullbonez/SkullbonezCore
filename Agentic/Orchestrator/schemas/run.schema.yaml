schema_version: 1
schema: run
required_fields:
  - schema_version
  - item_id
  - current_state
  - transition_history
  - source_plan_path
  - branch
  - started_at
  - baseline_git_status
  - policy_snapshot
  - queue_item_snapshot

optional_fields:
  - archived_plan_path
  - parent_branch
  - finished_at
  - elapsed
  - worker_role
  - verifier_role
  - validation_commands
  - validation_result
  - report_path
  - report_commit
  - report_web_url
  - pr_link
  - merge_status
  - blocker
  - failure_reason

invariants:
  - "Resume from run.yaml when it exists instead of reconstructing state from memory."
  - "If policy_snapshot changes mid-run, stop before risky actions."
  - "If baseline_git_status differs before worker start, record it and avoid reverting unrelated changes."
