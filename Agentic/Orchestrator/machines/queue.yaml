schema_version: 1
machine: roadmap_queue

selection:
  candidate_state: ready
  order:
    - priority_ascending
    - id_ascending
  guards:
    - policy.enabled
    - no_other_active_items
    - dependencies_satisfied

active_states:
  - running
  - reviewing
  - verifying
  - validating
  - reporting

terminal_success_states:
  - done
  - pr_open
  - merged

terminal_failure_states:
  - blocked
  - failed

terminal_skip_states:
  - skipped

stop_conditions:
  - blocked
  - failed
  - policy.disabled
  - missing_independent_verifier
  - invalid_queue_state
  - dirty_worktree_conflict
