schema_version: 1
description: "Human-readable queue mirror. queue.json is executable until YAML parser support is intentionally added."
policy: Agentic/Orchestrator/policy.yaml
machine: Agentic/Orchestrator/machines/roadmap-item.yaml
loop: Agentic/Orchestrator/agent-loop.yaml

state_vocabulary:
  - ready
  - running
  - reviewing
  - verifying
  - validating
  - reporting
  - done
  - pr_open
  - merged
  - blocked
  - failed
  - skipped

dependency_satisfied_states:
  normal:
    - done
    - merged
  stacked_pr:
    - done
    - merged
    - pr_open
  explicit_only:
    - skipped

items:
  - id: agent-docs-alignment
    plan: Agentic/Plans/Done/agent-docs-alignment-plan.md
    state: done
    priority: 5
    branch: main
    impact_area:
      - documentation
      - agent instructions
    validation_gate: "No validation required"
    validation_notes: "Documentation-only instruction alignment."
    depends_on: []
    report_required: false

  - id: orchestrator-yaml-foundation
    plan: Agentic/Plans/orchestration-framework-fix-plan.md
    state: done
    priority: 6
    branch: main
    impact_area:
      - documentation
      - orchestrator config
      - agent process
    validation_gate: "No validation required"
    validation_notes: "YAML/config documentation only. Future helper scripts require tools\\validate_fast.bat plus focused self-checks."
    depends_on:
      - agent-docs-alignment
    report_required: false
    archive_deferred:
      reason: "The YAML foundation is implemented, but the same source plan still tracks future checker, state-advance, report-commit, role, hook, and eval tooling phases."

  - id: orchestrator-executable-loop
    plan: Agentic/Plans/orchestration-framework-fix-plan.md
    state: done
    priority: 25
    branch: main
    impact_area:
      - tools
      - orchestrator config
      - agent process
    validation_gate: tools\validate_fast.bat
    validation_notes: "Tooling changes require tools\\validate_fast.bat plus tools\\orchestrator.bat check --self-test."
    depends_on:
      - orchestrator-yaml-foundation
    report_required: false
    archive_deferred:
      reason: "Future orchestrator phases remain in the same source plan."

  - id: tornado-mode-ui-cli
    plan: Agentic/Plans/tornado-mode-ui-cli-plan.md
    state: running
    priority: 30
    branch: codex/tornado-mode-ui-cli
    impact_area:
      - physics
      - UI
      - CLI
      - runtime
    validation_gate: tools\validate_full.bat
    validation_notes: "Tornado work touches runtime input, UI, and physics application paths; use the full gate unless the implemented slice is proven narrower."
    depends_on:
      - orchestrator-executable-loop
    dependency_mode: normal
    report_required: true
    artifact_commands: []
    screenshot_scenes: []

  - id: water-rendering-cleanup
    plan: Agentic/Plans/water-rendering-cleanup-plan.md
    state: ready
    priority: 40
    branch: codex/water-rendering-cleanup
    impact_area:
      - DX12
      - rendering
      - water
    validation_gate: tools\validate_dx12_renderer.bat
    validation_notes: "Renderer water work requires the DX12 renderer gate and intentional visual review."
    depends_on:
      - tornado-mode-ui-cli
    dependency_mode: normal
    report_required: true
    artifact_commands: []
    screenshot_scenes: []

  - id: draw-call-trace-tree
    plan: Agentic/Plans/draw-call-trace-tree-plan.md
    state: ready
    priority: 50
    branch: codex/draw-call-trace-tree
    impact_area:
      - DX12
      - renderer diagnostics
      - profiler UI
      - performance
    validation_gate: tools\validate_dx12_renderer.bat && tools\validate_perf.bat
    validation_notes: "Draw-call tracing touches draw hot paths and profiler UI; run renderer and perf gates."
    depends_on:
      - water-rendering-cleanup
    dependency_mode: normal
    report_required: true
    artifact_commands: []
    screenshot_scenes: []

  - id: dx12-render-graph-completion
    plan: Agentic/Plans/dx12-render-graph-completion-plan.md
    state: ready
    priority: 60
    branch: codex/dx12-render-graph-completion
    impact_area:
      - DX12
      - render architecture
      - resource barriers
    validation_gate: tools\validate_dx12_renderer.bat
    validation_notes: "Render graph/resource-state ownership requires DX12 validation and dx12_validation.txt checked for zero errors. Add tools\\validate_perf.bat for hot barrier scheduling changes."
    depends_on:
      - draw-call-trace-tree
    dependency_mode: normal
    report_required: true
    artifact_commands: []
    screenshot_scenes: []
